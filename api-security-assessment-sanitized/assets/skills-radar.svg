<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <defs>
    <linearGradient id="bgSk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#131317"/>
    </linearGradient>
    <linearGradient id="rad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a4d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b8001e" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="900" height="640" fill="url(#bgSk)"/>
  <text x="450" y="46" font-family="'DejaVu Sans Mono',monospace" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="5">RADAR DE SKILLS</text>
  <line x1="310" y1="58" x2="590" y2="58" stroke="#c4001f" stroke-width="2"/>

  <!-- center + radius -->
  <!-- axes: AppSec(0), WebSec(51.4), APISec(102.8), Linux(154.3), Networking(205.7), Documentation(257.1), ThreatModel(308.6) -->
  <!-- 7 axes; values 0-100 -->
  <g transform="translate(330,360)">
    <!-- grid rings -->
    <g fill="none" stroke="#2a2a31" stroke-width="1">
      <polygon points="0,-210 185.6,-99.8 207.6,107.3 60.9,201 -160.9,134.5 -204.9,-46.4 -87.5,-190.9"/>
      <polygon points="0,-157.5 139.2,-74.8 155.7,80.5 45.7,150.8 -120.7,100.9 -153.7,-34.8 -65.6,-143.2"/>
      <polygon points="0,-105 92.8,-49.9 103.8,53.7 30.4,100.5 -80.4,67.2 -102.4,-23.2 -43.7,-95.4"/>
      <polygon points="0,-52.5 46.4,-24.9 51.9,26.8 15.2,50.2 -40.2,33.6 -51.2,-11.6 -21.9,-47.7"/>
    </g>
    <!-- axes -->
    <g stroke="#3a3a44" stroke-width="1.5">
      <line x1="0" y1="0" x2="0" y2="-210"/>
      <line x1="0" y1="0" x2="185.6" y2="-99.8"/>
      <line x1="0" y1="0" x2="207.6" y2="107.3"/>
      <line x1="0" y1="0" x2="60.9" y2="201"/>
      <line x1="0" y1="0" x2="-160.9" y2="134.5"/>
      <line x1="0" y1="0" x2="-204.9" y2="-46.4"/>
      <line x1="0" y1="0" x2="-87.5" y2="-190.9"/>
    </g>
    <!-- data polygon: AppSec 92, WebSec 88, APISec 95, Linux 85, Networking 80, Documentation 90, ThreatModel 87 -->
    <!-- factor = radius/100 = 2.1 -->
    <polygon fill="url(#rad)" stroke="#ff2a4d" stroke-width="2.5" stroke-linejoin="round"
      points="0,-193.2 163.3,-87.8 197.2,102 54.3,179.1 -136.8,114.3 -178.3,-40.4 -76.1,-166.1"/>
    <!-- vertex dots -->
    <g fill="#ffffff">
      <circle cx="0" cy="-193.2" r="5"/><circle cx="163.3" cy="-87.8" r="5"/>
      <circle cx="197.2" cy="102" r="5"/><circle cx="54.3" cy="179.1" r="5"/>
      <circle cx="-136.8" cy="114.3" r="5"/><circle cx="-178.3" cy="-40.4" r="5"/>
      <circle cx="-76.1" cy="-166.1" r="5"/>
    </g>
    <!-- labels -->
    <g font-family="'DejaVu Sans Mono',monospace" font-size="14" fill="#ffffff" text-anchor="middle">
      <text x="0" y="-235">APPSEC 92</text>
      <text x="212" y="-112">SEGURANÇA WEB 88</text>
      <text x="240" y="118">API SECURITY 95</text>
      <text x="62" y="235">LINUX 85</text>
      <text x="-196" y="150">REDES 80</text>
      <text x="-238" y="-52">DOCUMENTAÇÃO 90</text>
      <text x="-118" y="-208">THREAT MODEL 87</text>
    </g>
  </g>

  <text x="450" y="620" font-family="'DejaVu Sans',sans-serif" font-size="12" fill="#8a8a93" text-anchor="middle">Auto-avaliado em um engajamento live — validado por cobertura de 130/130 rotas e 22 achados classificados</text>
</svg>