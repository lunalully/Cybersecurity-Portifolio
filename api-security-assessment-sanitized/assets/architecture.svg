    <text x="105" y="45" font-family="'DejaVu Sans',sans-serif" font-size="9" fill="#8a8a93" text-anchor="middle">catálogo · menus · favoritos</text>
  </g>

  <g transform="translate(430,240)">
    <rect width="210" height="64" rx="4" fill="#15151a" stroke="#33333a" stroke-width="1.5"/>
    <text x="105" y="27" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#ffffff" text-anchor="middle">MÓDULO DE PEDIDOS</text>
    <text x="105" y="45" font-family="'DejaVu Sans',sans-serif" font-size="9" fill="#8a8a93" text-anchor="middle">carrinho · máquina de estados · cupons</text>
  </g>

  <g transform="translate(810,240)">
    <rect width="210" height="64" rx="4" fill="#15151a" stroke="#33333a" stroke-width="1.5"/>
    <text x="105" y="27" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#ffffff" text-anchor="middle">MÓDULO DE PAGAMENTOS</text>
    <text x="105" y="45" font-family="'DejaVu Sans',sans-serif" font-size="9" fill="#8a8a93" text-anchor="middle">webhooks Asaas · config</text>
  </g>

  <g transform="translate(1070,240)">
    <rect width="150" height="64" rx="4" fill="#15151a" stroke="#ff2a4d" stroke-width="1.5"/>
    <text x="75" y="27" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#ff2a4d" text-anchor="middle">WEBHOOKS</text>
    <text x="75" y="45" font-family="'DejaVu Sans',sans-serif" font-size="9" fill="#8a8a93" text-anchor="middle">eventos asaas</text>
  </g>

  <g transform="translate(640,380)">
    <rect width="300" height="78" rx="6" fill="#0e0e12" stroke="#ff2a4d" stroke-width="2"/>
    <text x="150" y="30" font-family="'DejaVu Sans Mono',monospace" font-size="14" fill="#ff2a4d" text-anchor="middle">DATA STORE</text>
    <text x="150" y="52" font-family="'DejaVu Sans',sans-serif" font-size="11" fill="#c9c9d0" text-anchor="middle">PostgreSQL · ownership checks</text>
    <text x="150" y="68" font-family="'DejaVu Sans Mono',monospace" font-size="10" fill="#8a8a93" text-anchor="middle">store.OwnerID == requesterID</text>
  </g>

  <line x1="745" y1="304" x2="790" y2="380" stroke="#4a4a55" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="304" x2="700" y2="380" stroke="#4a4a55" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g transform="translate(640,510)">
    <rect width="300" height="58" rx="6" fill="#15151a" stroke="#33333a" stroke-width="1.5"/>
    <text x="150" y="25" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#ffffff" text-anchor="middle">REDIS · RATE LIMIT</text>
    <text x="150" y="43" font-family="'DejaVu Sans',sans-serif" font-size="10" fill="#8a8a93" text-anchor="middle">10/min auth · 60/min catalog</text>
  </g>
  <line x1="790" y1="458" x2="790" y2="510" stroke="#4a4a55" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="640" y="640" font-family="'DejaVu Sans',sans-serif" font-size="11" fill="#8a8a93" text-anchor="middle">130 endpoints · Go/Gin · 3 roles (customer · store_owner · admin) · OAuth providers (conditional)</text>
  <line x1="300" y1="668" x2="980" y2="668" stroke="#33333a" stroke-width="1"/>
</svg>