<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#131317"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#15151a"/>
    </linearGradient>
    <linearGradient id="rd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a4d"/>
      <stop offset="1" stop-color="#b8001e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff2a4d"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bgA)"/>

  <text x="640" y="48" font-family="'DejaVu Sans Mono',monospace" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="6">ARQUITETURA DA APLICAÇÃO</text>
  <line x1="320" y1="62" x2="960" y2="62" stroke="#c4001f" stroke-width="2"/>

  <g transform="translate(90,120)">
    <rect width="170" height="70" rx="4" fill="#1a1a20" stroke="#33333a" stroke-width="1.5"/>
    <text x="85" y="30" font-family="'DejaVu Sans Mono',monospace" font-size="13" fill="#ffffff" text-anchor="middle">CLIENTE</text>
    <text x="85" y="50" font-family="'DejaVu Sans',sans-serif" font-size="10" fill="#8a8a93" text-anchor="middle">mobile / web</text>
  </g>

  <line x1="260" y1="155" x2="330" y2="155" stroke="#ff2a4d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="295" y="143" font-family="'DejaVu Sans Mono',monospace" font-size="9" fill="#8a8a93" text-anchor="middle">HTTPS</text>

  <g transform="translate(350,120)">
    <rect width="190" height="70" rx="4" fill="url(#gw)" stroke="#ff2a4d" stroke-width="2"/>
    <text x="95" y="30" font-family="'DejaVu Sans Mono',monospace" font-size="13" fill="#ff2a4d" text-anchor="middle">API GATEWAY</text>
    <text x="95" y="50" font-family="'DejaVu Sans',sans-serif" font-size="10" fill="#8a8a93" text-anchor="middle">TLS 1.3 · CORS · headers</text>
  </g>

  <line x1="540" y1="155" x2="610" y2="155" stroke="#ff2a4d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="575" y="143" font-family="'DejaVu Sans Mono',monospace" font-size="9" fill="#8a8a93" text-anchor="middle">JWT</text>

  <g transform="translate(630,120)">
    <rect width="190" height="70" rx="4" fill="url(#gw)" stroke="#33333a" stroke-width="1.5"/>
    <text x="95" y="30" font-family="'DejaVu Sans Mono',monospace" font-size="13" fill="#ffffff" text-anchor="middle">SERVIÇO DE AUTH</text>
    <text x="95" y="50" font-family="'DejaVu Sans',sans-serif" font-size="10" fill="#8a8a93" text-anchor="middle">login · refresh · RBAC</text>
  </g>

  <line x1="820" y1="155" x2="890" y2="155" stroke="#ff2a4d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="855" y="143" font-family="'DejaVu Sans Mono',monospace" font-size="9" fill="#8a8a93" text-anchor="middle">RBAC</text>

  <g transform="translate(910,120)">
    <rect width="190" height="70" rx="4" fill="url(#gw)" stroke="#33333a" stroke-width="1.5"/>
    <text x="95" y="30" font-family="'DejaVu Sans Mono',monospace" font-size="13" fill="#ffffff" text-anchor="middle">ADMIN</text>
    <text x="95" y="50" font-family="'DejaVu Sans',sans-serif" font-size="10" fill="#8a8a93" text-anchor="middle">somente admin / suporte</text>
  </g>

