<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#131317"/>
    </linearGradient>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff2a4d"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="url(#bgR)"/>
  <text x="500" y="44" font-family="'DejaVu Sans Mono',monospace" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="5">MODELO DE APLICAÇÃO DE RBAC</text>
  <line x1="330" y1="56" x2="670" y2="56" stroke="#c4001f" stroke-width="2"/>

  <g transform="translate(380,90)">
    <rect width="240" height="60" rx="4" fill="#1a1a20" stroke="#ff2a4d" stroke-width="1.5"/>
    <text x="120" y="28" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#ffffff" text-anchor="middle">MIDDLEWARE DE JWT</text>
    <text x="120" y="46" font-family="'DejaVu Sans',sans-serif" font-size="10" fill="#8a8a93" text-anchor="middle">autentica · injeta uid/role</text>
  </g>

  <g font-family="'DejaVu Sans Mono',monospace" font-size="12">
    <g transform="translate(90,220)">
      <rect width="230" height="74" rx="4" fill="#121216" stroke="#33333a" stroke-width="1.5"/>
      <text x="115" y="28" fill="#2d6a4f">CLIENTE</text>
      <text x="115" y="48" fill="#8a8a93" font-family="'DejaVu Sans',sans-serif" font-size="10" text-anchor="middle">pedidos · próprios endereços</text>
      <text x="115" y="62" fill="#8a8a93" font-family="'DejaVu Sans',sans-serif" font-size="10" text-anchor="middle">catálogo (público)</text>
    </g>
    <g transform="translate(385,220)">
      <rect width="230" height="74" rx="4" fill="#121216" stroke="#33333a" stroke-width="1.5"/>
      <text x="115" y="28" fill="#2d6a4f">STORE_OWNER</text>
      <text x="115" y="48" fill="#8a8a93" font-family="'DejaVu Sans',sans-serif" font-size="10" text-anchor="middle">própria loja · menus · pedidos</text>
      <text x="115" y="62" fill="#8a8a93" font-family="'DejaVu Sans',sans-serif" font-size="10" text-anchor="middle">métricas · payment-config</text>
    </g>
    <g transform="translate(680,220)">
      <rect width="230" height="74" rx="4" fill="#121216" stroke="#33333a" stroke-width="1.5"/>
      <text x="115" y="28" fill="#2d6a4f">ADMIN / SUPORTE</text>
      <text x="115" y="48" fill="#8a8a93" font-family="'DejaVu Sans',sans-serif" font-size="10" text-anchor="middle">dashboard da plataforma</text>
      <text x="115" y="62" fill="#8a8a93" font-family="'DejaVu Sans',sans-serif" font-size="10" text-anchor="middle">gestão de usuários &amp; lojas</text>
    </g>
  </g>

  <line x1="500" y1="150" x2="205" y2="220" stroke="#4a4a55" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="500" y1="150" x2="500" y2="220" stroke="#4a4a55" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="500" y1="150" x2="795" y2="220" stroke="#4a4a55" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <g transform="translate(150,340)">
    <rect width="700" height="78" rx="4" fill="#0e0e12" stroke="#33333a" stroke-width="1.5"/>
    <text x="350" y="28" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#ffffff" text-anchor="middle">VERIFICAÇÃO DE PROPRIEDADE (nível de handler)</text>
    <text x="350" y="50" font-family="'DejaVu Sans',sans-serif" font-size="11" fill="#2d6a4f" text-anchor="middle">store.OwnerID == requesterID → senão 403</text>
    <text x="350" y="66" font-family="'DejaVu Sans',sans-serif" font-size="10" fill="#8a8a93" text-anchor="middle">order.user_id vs store.owner_id separados por design</text>
  </g>

  <g transform="translate(150,450)">
    <rect width="700" height="62" rx="4" fill="#1a1a20" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="350" y="27" font-family="'DejaVu Sans Mono',monospace" font-size="12" fill="#2d6a4f" text-anchor="middle">VALIDADO: sem escalada horizontal, sem bypass de admin em endereço/pedidos</text>
    <text x="350" y="45" font-family="'DejaVu Sans',sans-serif" font-size="10" fill="#8a8a93" text-anchor="middle">tentativas customer→store→admin todas bloqueadas com 403</text>
  </g>
