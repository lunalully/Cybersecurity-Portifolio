<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#131317"/>
    </linearGradient>
  </defs>
  <rect width="700" height="560" fill="url(#bgM)"/>
  <text x="350" y="44" font-family="'DejaVu Sans Mono',monospace" font-size="19" fill="#ffffff" text-anchor="middle" letter-spacing="4">MATRIZ DE RISCO</text>
  <line x1="250" y1="56" x2="450" y2="56" stroke="#c4001f" stroke-width="2"/>

  <g font-family="'DejaVu Sans Mono',monospace" font-size="10">
    <rect x="120" y="90" width="100" height="420" fill="#16161a" stroke="#33333a" stroke-width="1"/>
    <text x="170" y="310" fill="#8a8a93" text-anchor="middle" transform="rotate(-90 170 310)" font-size="13">IMPACTO</text>

    <text x="175" y="115" fill="#ff2a4d" text-anchor="middle">CRIT</text>
    <text x="175" y="210" fill="#e9a319" text-anchor="middle">HIGH</text>
    <text x="175" y="315" fill="#2d6a4f" text-anchor="middle">MED</text>
    <text x="175" y="410" fill="#4a4a55" text-anchor="middle">LOW</text>
    <text x="175" y="493" fill="#4a4a55" text-anchor="middle">INFO</text>

    <rect x="220" y="90" width="100" height="420" fill="#16161a" stroke="#33333a" stroke-width="1"/>
    <rect x="320" y="90" width="100" height="420" fill="#16161a" stroke="#33333a" stroke-width="1"/>
    <rect x="420" y="90" width="100" height="420" fill="#16161a" stroke="#33333a" stroke-width="1"/>
    <rect x="520" y="90" width="80" height="420" fill="#16161a" stroke="#33333a" stroke-width="1"/>

    <text x="270" y="110" fill="#8a8a93" text-anchor="middle">LOW</text>
    <text x="370" y="110" fill="#8a8a93" text-anchor="middle">MED</text>
    <text x="470" y="110" fill="#8a8a93" text-anchor="middle">HIGH</text>
    <text x="560" y="110" fill="#8a8a93" text-anchor="middle">CRIT</text>
    <text x="350" y="535" fill="#8a8a93" text-anchor="middle" font-size="11">PROBABILIDADE</text>
  </g>

  <!-- dots: INFO at (low,info) ~ (270,485); LOW at (270,385)/(370,385); MEDIUM at (370,300); HIGH at (470,205) -->
  <g font-family="'DejaVu Sans Mono',monospace" font-size="11" fill="#ffffff" text-anchor="middle">
    <circle cx="270" cy="485" r="14" fill="#4a4a55"/><text x="270" y="489" font-size="10">9</text>
    <circle cx="320" cy="395" r="14" fill="#2d6a4f"/><text x="320" y="399" font-size="10">4</text>
    <circle cx="360" cy="395" r="14" fill="#2d6a4f"/><text x="360" y="399" font-size="10">3</text>
    <circle cx="350" cy="300" r="14" fill="#e9a319"/><text x="350" y="304" font-size="10">4</text>
    <circle cx="455" cy="200" r="14" fill="#ff2a4d"/><text x="455" y="204" font-size="10">2</text>
  </g>

  <g font-family="'DejaVu Sans',sans-serif" font-size="11" fill="#8a8a93">
    <text x="350" y="80" text-anchor="middle">22 findings mapped by impact × likelihood (post-triage)</text>
  </g>
</svg>